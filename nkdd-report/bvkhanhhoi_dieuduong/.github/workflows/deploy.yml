name: Deploy
on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    steps:
      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:GIT_TERMINAL_PROMPT = "0"
          Set-Location C:\quyhdp\nkdd-report\bvkhanhhoi_dieuduong
          git config --global --add safe.directory C:/quyhdp/nkdd-report/bvkhanhhoi_dieuduong

          Write-Host "=== git sync ==="
          $b64 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$($env:GH_TOKEN)"))
          git -c "http.extraheader=AUTHORIZATION: basic $b64" fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          git reset --hard origin/main
          if ($LASTEXITCODE -ne 0) { throw "git reset failed" }
          git log -1 --format="Deployed commit: %h %s"

          Write-Host "=== stopping service ==="
          sc.exe stop NKDD-Report | Out-Null
          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -in @("node.exe","npm.cmd","cmd.exe") -and $_.CommandLine -like "*bvkhanhhoi_dieuduong*" } |
            ForEach-Object { Write-Host "Kill $($_.ProcessId)"; Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          for ($i = 0; $i -lt 10; $i++) {
            if ((Get-Service NKDD-Report).Status -eq "Stopped") { break }
            Start-Sleep -Seconds 2
          }
          Write-Host "Service status: $((Get-Service NKDD-Report).Status)"
          Start-Sleep -Seconds 3

          try {
            Write-Host "=== npm ci ==="
            npm ci
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }

            Write-Host "=== prisma generate ==="
            npx prisma generate
            if ($LASTEXITCODE -ne 0) { throw "prisma generate failed" }

            Write-Host "=== build ==="
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "build failed" }
          }
          finally {
            Write-Host "=== starting service ==="
            Start-Service "NKDD-Report"
          }

          Start-Sleep -Seconds 10
          netstat -ano | findstr :5433
          Get-Service NKDD-Report
